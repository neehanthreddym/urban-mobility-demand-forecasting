[project]
name = "urban-mobility-demand-forecasting"
version = "0.1.0"
description = "Hourly NYC taxi pickup forecasting and capacity-planning portfolio project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
]

[project.optional-dependencies]
modeling = [
    "lightgbm",
    "mlflow>=3.18.0",
    "scikit-learn",
]
data-versioning = [
    "dvc[gdrive]>=3.67.1",
]
spark = [
    "pyspark==4.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
